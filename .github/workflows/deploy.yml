name: Deploy Vite Project

on:
  push:
    branches:
      - ballotbash  # Trigger build when pushing to 'ballotbash' branch

permissions:
  contents: write  # Ensures GitHub Actions can push changes to the repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: List output files (debugging)
        run: ls -R dist

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3 
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # - name: Deploy to GitHub Pages
      #   uses: JamesIves/github-pages-deploy-action@v4
      #   with:
      #     branch: gh-pages  # Deploy built files to 'gh-pages'
      #     folder: dist       # Ensure 'dist/' is uploaded
      #     clean: true        # Remove old files before deploying
